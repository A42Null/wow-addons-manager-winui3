name: Build (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (x64, self-contained)
        run: msbuild src/WoWAddonManager/WoWAddonManager.csproj /restore /p:Configuration=Release /p:Platform=x64 /bl:build.binlog

      - name: Show XamlCompiler output (if any)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter output.json | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            Get-Content $_.FullName
          }

      - name: Upload binlog (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-binlog
          path: build.binlog
          if-no-files-found: ignore

      - name: Publish self-contained output (MSBuild Publish target)
        run: msbuild src/WoWAddonManager/WoWAddonManager.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:PublishDir=publish /t:Publish

      - name: Zip output
        shell: pwsh
        run: |
          $out = "publish"
          if (-not (Test-Path "$out/WoWAddonManager.exe")) {
            $exe = Get-ChildItem "src/WoWAddonManager/bin" -Recurse -Filter "WoWAddonManager.exe" | Select-Object -First 1
            $out = $exe.DirectoryName
          }
          Write-Host "Output dir: $out"
          Compress-Archive -Path "$out/*" -DestinationPath "WoWAddonManager-win-x64.zip" -Force
          # Advanced Installer 工程(.aip)以 versions\WoWAddonManager-win-x64 为文件源
          if (Test-Path "versions\WoWAddonManager-win-x64") { Remove-Item "versions\WoWAddonManager-win-x64" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path "versions\WoWAddonManager-win-x64" | Out-Null
          Copy-Item "$out/*" "versions\WoWAddonManager-win-x64" -Recurse -Force

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path "src/WoWAddonManager/WoWAddonManager.csproj" -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Install Advanced Installer (for .aip build)
        continue-on-error: true
        shell: pwsh
        run: |
          winget install --id Caphyon.AdvancedInstaller -e --accept-source-agreements --accept-package-agreements --silent --disable-interactivity
          $reg = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                 Where-Object { $_.DisplayName -like 'Advanced Installer*' } | Select-Object -First 1
          if ($reg) { Write-Host "Advanced Installer: $($reg.DisplayVersion) at $($reg.InstallLocation)" }
          else { Write-Host "Advanced Installer not found - WiX fallback will be used" }

      - name: Build MSI (Advanced Installer .aip, WiX fallback)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          powershell -ExecutionPolicy Bypass -File installer/build-msi.ps1 -Version $v -PublishDir "versions\WoWAddonManager-win-x64" -OutputDir "versions"
          Get-ChildItem versions/*.msi | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoWAddonManager-win-x64
          path: WoWAddonManager-win-x64.zip

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoWAddonManager-msi
          path: "versions/*.msi"
          if-no-files-found: error

      - name: Publish rolling dev-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create dev-build --repo ${{ github.repository }} --title "开发构建 (dev)" --notes "main 分支最新自动构建，每次推送覆盖" --prerelease || true
          gh release upload dev-build WoWAddonManager-win-x64.zip --clobber --repo ${{ github.repository }}
          gh release upload dev-build versions/*.msi --clobber --repo ${{ github.repository }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: WoWAddonManager-win-x64

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: WoWAddonManager-msi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --title "WoWAddonManager ${GITHUB_REF_NAME}" --generate-notes || echo "release exists, reuse"
          gh release upload "${GITHUB_REF_NAME}" "WoWAddonManager-win-x64.zip" *.msi --clobber --repo "${{ github.repository }}"
