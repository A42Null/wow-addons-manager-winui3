name: Build (Windows)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (x64, self-contained)
        run: dotnet build src/WoWAddonManager/WoWAddonManager.csproj -c Release -p:Platform=x64

      - name: Zip output
        shell: pwsh
        run: |
          $out = "src/WoWAddonManager/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64"
          if (-not (Test-Path $out)) { $out = Get-ChildItem "src/WoWAddonManager/bin" -Recurse -Filter "WoWAddonManager.exe" | Select-Object -First 1 -ExpandProperty DirectoryName }
          Write-Host "Output dir: $out"
          Compress-Archive -Path "$out/*" -DestinationPath "WoWAddonManager-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WoWAddonManager-win-x64
          path: WoWAddonManager-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: WoWAddonManager-win-x64

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" "WoWAddonManager-win-x64.zip" --title "WoWAddonManager ${GITHUB_REF_NAME}" --generate-notes
