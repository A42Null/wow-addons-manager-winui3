# CNB 云原生流水线
# 职责：
#   1) 等待 GitHub Actions（在 windows-latest 上执行的 WinUI3 构建）完成
#   2) 把 dev-build Release 的产物（zip + MSI）收集到 CNB 仓库的 dist 分支
#   3) 创建/复用 CNB Release（同版本号），上传 zip 与 MSI 作为附件
#   4) 清理历史错误创建的版本（例如版本号取错时产生的 v1.0.0）
# 之后可直接从 CNB（仓库 dist 分支 / Release 页面）下载产物，无需访问 GitHub。

main:
  push:
    - name: collect-build-artifact
      stages:
        - name: 同步到 GitHub（如已配置 GITHUB_TOKEN 密钥）
          script: |
            if [ -n "$GITHUB_TOKEN" ]; then
              git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/A42Null/wow-addons-manager-winui3.git" HEAD:main
            else
              echo "未配置 GITHUB_TOKEN，跳过（构建由本地同时推送 GitHub 触发）"
            fi

        - name: 等待 GitHub Actions 构建完成
          script: |
            SHA=$(git rev-parse HEAD)
            ok=0
            for i in $(seq 1 120); do
              resp=$(curl -s --max-time 20 "https://api.github.com/repos/A42Null/wow-addons-manager-winui3/actions/runs?head_sha=${SHA}&per_page=10")
              line=$(echo "$resp" | grep -o '"status": *"[a-z_]*"' | head -1)
              concl=$(echo "$resp" | grep -o '"conclusion": *"[a-z_]*"' | head -1)
              echo "[$i] $line $concl"
              if echo "$line" | grep -q "completed"; then
                if echo "$concl" | grep -q "success"; then ok=1; break; fi
                echo "GitHub Actions 构建失败"; exit 1
              fi
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "等待构建超时"; exit 1; }

        - name: 读取版本号与产物下载地址
          script: |
            VERSION=$(git show origin/main:src/WoWAddonManager/WoWAddonManager.csproj | grep -o '<Version>[^<]*</Version>' | head -1 | sed 's/<[^>]*>//g')
            echo "VERSION=$VERSION"
            # 固定命名规则（CI 生成）：zip 与 MSI 名称固定，无需解析页面/API
            BASE="https://github.com/A42Null/wow-addons-manager-winui3/releases/download/dev-build"
            ZIP_URL="$BASE/WoWAddonManager-win-x64.zip"
            MSI_URL="$BASE/WoWAddonManager-${VERSION}-x64.msi"
            echo "ZIP_URL=$ZIP_URL"
            echo "MSI_URL=$MSI_URL"
            # 兜底：若固定地址不可用，再用 Releases API 解析
            if ! curl -sIL --max-time 90 "$MSI_URL" | grep -qi "200"; then
              echo "固定 MSI 地址不可用，尝试 Releases API"
              REL_JSON=$(curl -sL --max-time 120 "https://api.github.com/repos/A42Null/wow-addons-manager-winui3/releases/tags/dev-build" || true)
              A_ZIP=$(echo "$REL_JSON" | grep -oE '"browser_download_url":"[^"]+\.zip"' | head -1 | cut -d'"' -f4)
              A_MSI=$(echo "$REL_JSON" | grep -oE '"browser_download_url":"[^"]+\.msi"' | head -1 | cut -d'"' -f4)
              [ -n "$A_ZIP" ] && ZIP_URL="$A_ZIP"
              [ -n "$A_MSI" ] && MSI_URL="$A_MSI"
              echo "fallback ZIP_URL=$ZIP_URL"
              echo "fallback MSI_URL=$MSI_URL"
            fi
            printf '%s\n' "$ZIP_URL" > /tmp/zip_url.txt
            printf '%s\n' "$MSI_URL" > /tmp/msi_url.txt
            printf '%s\n' "$VERSION" > /tmp/version.txt

        - name: 下载产物（zip + MSI）并发布到 dist 分支
          script: |
            ZIP_URL=$(cat /tmp/zip_url.txt 2>/dev/null || true)
            MSI_URL=$(cat /tmp/msi_url.txt 2>/dev/null || true)
            if [ -z "$ZIP_URL" ]; then echo "未取得 zip 下载地址"; exit 1; fi
            curl -sL --max-time 900 --retry 3 -o /tmp/wam.zip "$ZIP_URL"
            if [ ! -s /tmp/wam.zip ] || [ $(stat -c%s /tmp/wam.zip) -lt 1000000 ]; then
              echo "zip 下载异常"; exit 1
            fi
            if [ -n "$MSI_URL" ]; then
              curl -sL --max-time 900 --retry 3 -o /tmp/wam.msi "$MSI_URL"
              if [ ! -s /tmp/wam.msi ] || [ $(stat -c%s /tmp/wam.msi) -lt 1000000 ]; then
                echo "MSI 下载异常，忽略"; rm -f /tmp/wam.msi
              fi
            fi
            ls -la /tmp/wam.zip /tmp/wam.msi 2>/dev/null || true
            git config user.email "ci@cnb.cool"
            git config user.name "cnb-ci"
            # dist 分支始终基于最新的 main 重建
            git fetch origin main && git checkout -B dist origin/main
            mkdir -p build
            cp /tmp/wam.zip build/WoWAddonManager-win-x64.zip
            if [ -f /tmp/wam.msi ]; then cp /tmp/wam.msi "build/$(basename "$MSI_URL")"; fi
            git add -A build
            git commit -m "artifact: $(date '+%F %T') 来自 GitHub Actions 的构建产物" || echo "无变化"
            # dist 分支每次基于最新 main 重建，历史不相关，需强制推送
            git push -f origin dist
            # 回到 main，避免后续 stage 读到旧代码
            git checkout main

        # 说明：CNB Release 的创建与资产上传已迁移到 GitHub Actions
        # （.github/workflows/build.yml 的 publish-cnb job，使用仓库密钥 CNB_TOKEN），
        # 此处只负责把产物收集到 dist 分支。

        - name: 清理错误创建的版本
          script: |
            echo "版本清理由人工在 CNB 页面执行，流水线不自动删除任何版本"
            echo "cleanup skipped by design"

$:
  vscode:
    - docker:
        image: tencentos/server
