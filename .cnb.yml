# CNB 云原生流水线
# 职责：
#   1) 等待 GitHub Actions（在 windows-latest 上执行的 WinUI3 构建）完成
#   2) 把 dev-build Release 的产物（zip + MSI）收集到 CNB 仓库的 dist 分支
#   3) 创建 CNB Release（同版本号），上传 zip 与 MSI 作为附件
# 之后可直接从 CNB（仓库 dist 分支 / Release 页面）下载产物，无需访问 GitHub。

main:
  push:
    - name: collect-build-artifact
      stages:
        - name: 同步到 GitHub（如已配置 GITHUB_TOKEN 密钥）
          script: |
            if [ -n "$GITHUB_TOKEN" ]; then
              git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/A42Null/wow-addons-manager-winui3.git" HEAD:main
            else
              echo "未配置 GITHUB_TOKEN，跳过（构建由本地同时推送 GitHub 触发）"
            fi

        - name: 等待 GitHub Actions 构建完成
          script: |
            SHA=$(git rev-parse HEAD)
            ok=0
            for i in $(seq 1 90); do
              resp=$(curl -s --max-time 20 "https://api.github.com/repos/A42Null/wow-addons-manager-winui3/actions/runs?head_sha=${SHA}&per_page=10")
              line=$(echo "$resp" | grep -o '"status": *"[a-z_]*"' | head -1)
              concl=$(echo "$resp" | grep -o '"conclusion": *"[a-z_]*"' | head -1)
              echo "[$i] $line $concl"
              if echo "$line" | grep -q "completed"; then
                if echo "$concl" | grep -q "success"; then ok=1; break; fi
                echo "GitHub Actions 构建失败"; exit 1
              fi
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "等待构建超时"; exit 1; }

        - name: 读取版本号
          script: |
            VERSION=$(git show HEAD:src/WoWAddonManager/WoWAddonManager.csproj | grep -o '<Version>[^<]*</Version>' | head -1 | sed 's/<[^>]*>//g')
            echo "VERSION=$VERSION"

        - name: 下载产物（zip + MSI）并发布到 dist 分支
          script: |
            set -e
            BASE="https://github.com/A42Null/wow-addons-manager-winui3/releases/download/dev-build"
            curl -sL --max-time 900 -o /tmp/wam.zip "$BASE/WoWAddonManager-win-x64.zip"
            test $(stat -c%s /tmp/wam.zip) -gt 1000000 || { echo "zip 下载异常"; exit 1; }
            # 注意：GitHub 会 302，必须加 -L 才能拿到资产列表页
            MSI_URL=$(curl -sL --max-time 60 "$BASE" | grep -oE 'WoWAddonManager-[0-9.]+-x64\.msi' | head -1 || true)
            echo "MSI_URL=$MSI_URL"
            if [ -n "$MSI_URL" ]; then
              curl -sL --max-time 900 -o /tmp/wam.msi "$BASE/$MSI_URL"
              if [ ! -s /tmp/wam.msi ] || [ $(stat -c%s /tmp/wam.msi) -lt 1000000 ]; then
                echo "MSI 下载异常"; rm -f /tmp/wam.msi
              fi
            fi
            ls -la /tmp/wam.zip /tmp/wam.msi 2>/dev/null || true
            git config user.email "ci@cnb.cool"
            git config user.name "cnb-ci"
            # dist 分支始终基于最新的 main 重建
            git fetch origin main && git checkout -B dist origin/main
            mkdir -p build
            cp /tmp/wam.zip build/WoWAddonManager-win-x64.zip
            if [ -f /tmp/wam.msi ]; then cp /tmp/wam.msi "build/${MSI_URL}"; fi
            git add -A build
            git commit -m "artifact: $(date '+%F %T') 来自 GitHub Actions 的构建产物" || echo "无变化"
            git push origin dist
            # 回到 main，避免后续 stage 读到旧代码
            git checkout main

        - name: 创建 CNB Release 并上传资产（zip + MSI）
          script: |
            API="https://api.cnb.cool/A42Null/wow-addons-manager-winui3"
            AUTH="Authorization: Bearer ${CNB_TOKEN:-${CNB_ACCESS_TOKEN}}"
            # 版本号一律从 origin/main 的 csproj 读取（不受当前 HEAD 影响）
            VERSION=$(git show origin/main:src/WoWAddonManager/WoWAddonManager.csproj | grep -o '<Version>[^<]*</Version>' | head -1 | sed 's/<[^>]*>//g')
            if [ -z "$VERSION" ]; then
              VERSION=$(curl -sL --max-time 60 "https://github.com/A42Null/wow-addons-manager-winui3/releases/download/dev-build" | grep -oE 'WoWAddonManager-[0-9.]+-x64\.msi' | head -1 | sed 's/WoWAddonManager-//; s/-x64\.msi//')
            fi
            TAG="v${VERSION}"
            echo "token present: $([ -n "${CNB_TOKEN:-}" ] && echo yes || echo no)"
            echo "VERSION=$VERSION"
            echo "tag: $TAG"

            # 确保 CNB 仓库存在该 tag
            git config user.email "ci@cnb.cool"
            git config user.name "cnb-ci"
            git checkout -B "release-$TAG" origin/main 2>/dev/null || git checkout -B "release-$TAG"
            git tag -f "$TAG" >/dev/null 2>&1 || true
            git push origin "$TAG" || echo "tag 推送失败（继续尝试创建 release）"

            rel=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"WoWAddonManager $TAG\",\"body\":\"魔兽世界插件管理器 $TAG。附件：绿色版 zip 与 MSI 安装包。\"}" \
              "$API/-/releases")
            echo "CREATE: $(echo "$rel" | head -c 300)"
            rel_id=$(echo "$rel" | grep -oE '"id":[0-9]+' | head -1 | grep -oE '[0-9]+')
            if [ -z "$rel_id" ]; then
              # 已存在同名版本时，复用现有 release
              rel=$(curl -s -H "$AUTH" -H "Accept: application/json" "$API/-/releases?per_page=20")
              echo "LIST: $(echo "$rel" | head -c 300)"
              rel_id=$(echo "$rel" | tr '{' '\n' | grep "\"tag_name\":\"$TAG\"" | grep -oE '"id":[0-9]+' | head -1 | grep -oE '[0-9]+')
            fi
            echo "release_id=$rel_id"
            if [ -z "$rel_id" ]; then echo "无法获得 release id，跳过附件上传"; exit 0; fi

            upload_asset() {
              name=$1; file=$2
              if [ ! -f "$file" ]; then echo "skip missing file: $file"; return 0; fi
              up=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/json" \
                -d "{\"asset_name\":\"$name\"}" \
                "$API/-/releases/$rel_id/-/asset-upload-url?overwrite=true")
              echo "UPLOAD-URL[$name]: $(echo "$up" | head -c 400)"
              url=$(echo "$up" | grep -oE '"upload_url":"[^"]+"' | head -1 | cut -d'"' -f4)
              if [ -z "$url" ]; then echo "no upload url for $name"; return 0; fi
              curl -s -X PUT -H "$AUTH" --upload-file "$file" "$url" | head -c 200; echo
              conf=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -H "Accept: application/json" \
                -d "{\"verify_url\":\"$up\"}" \
                "$API/-/releases/$rel_id/-/asset-upload-confirmation")
              echo "CONFIRM[$name]: $(echo "$conf" | head -c 300)"
            }

            upload_asset "WoWAddonManager-win-x64.zip" /tmp/wam.zip || true
            MSI_URL=$(curl -sL --max-time 60 "https://github.com/A42Null/wow-addons-manager-winui3/releases/download/dev-build" | grep -oE 'WoWAddonManager-[0-9.]+-x64\.msi' | head -1 || true)
            echo "MSI asset name: $MSI_URL"
            if [ -n "$MSI_URL" ]; then upload_asset "$MSI_URL" /tmp/wam.msi || true; fi
            echo "CNB release done"

$:
  vscode:
    - docker:
        image: tencentos/server
